<!DOCTYPE html>
<html>
<head>
    <title>Passenger Dashboard - Bus Booking</title>
    <link rel="stylesheet" href="../css/style.css">
    <style>
        body { height: auto; }
        .dashboard-container {
            max-width: 1000px;
            margin: 20px auto;
            padding: 20px;
            background: white;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; border-bottom: 2px solid #3498db; padding-bottom: 15px; }
        .header h2 { margin: 0; color: #2c3e50; }
        .logout-btn { background-color: #e74c3c; }
        .logout-btn:hover { background-color: #c0392b; }
        .search-form { background: #ecf0f1; padding: 20px; border-radius: 8px; margin-bottom: 20px; }
        .form-row { display: flex; gap: 10px; margin-bottom: 15px; flex-wrap: wrap; }
        .form-row input, .form-row select { flex: 1; min-width: 200px; }
        .results { margin-top: 20px; }
        .bus-card { background: #f8f9fa; padding: 15px; margin-bottom: 15px; border-left: 4px solid #3498db; border-radius: 5px; }
        .bus-card h4 { margin: 0 0 10px 0; color: #2c3e50; }
        .bus-info { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 10px 0; font-size: 14px; }
        .bus-info strong { color: #555; }
        .bus-info span { color: #27ae60; font-weight: bold; }
        .seat-input { width: 80px; }
        .bookings { margin-top: 30px; }
        .booking-card { background: #e8f8f5; padding: 15px; margin-bottom: 15px; border-left: 4px solid #27ae60; border-radius: 5px; }
        .booking-card h4 { margin: 0 0 10px 0; color: #16a085; }
        .status-confirmed { color: #27ae60; font-weight: bold; }
        .status-cancelled { color: #e74c3c; font-weight: bold; }
        button { margin-top: 10px; margin-right: 10px; }
    </style>
</head>
<body>
    <div class="dashboard-container">
        <div class="header">
            <h2>🚌 Passenger Dashboard</h2>
            <div>
                <span id="userName" style="margin-right: 20px; color: #2c3e50;"></span>
                <button class="logout-btn" onclick="logout()">Logout</button>
            </div>
        </div>

        <div class="search-form">
            <h3>Search Buses</h3>
            <div class="form-row">
                <input type="text" id="source" placeholder="From (City)" required>
                <input type="text" id="destination" placeholder="To (City)" required>
                <button onclick="searchBuses()">Search</button>
            </div>
        </div>

        <div class="results">
            <div id="busResults"></div>
        </div>

        <div class="bookings">
            <h3>My Bookings</h3>
            <button onclick="loadMyBookings()" style="margin-bottom: 15px;">Load My Bookings</button>
            <div id="bookingsList"></div>
        </div>
    </div>

    <script src="../js/dashboard.js"></script>
    <script>
        // Load user data on page load
        window.onload = function() {
            const userName = localStorage.getItem("userName");
            const userRole = localStorage.getItem("userRole");
            
            if (!userName || userRole !== 'PASSENGER') {
                window.location.href = 'login.html';
            }
            document.getElementById('userName').innerText = "Welcome, " + userName;
        };

        function logout() {
            localStorage.clear();
            window.location.href = 'login.html';
        }

        function searchBuses() {
            const source = document.getElementById('source').value;
            const destination = document.getElementById('destination').value;

            fetch('../api/bus?action=search&source=' + encodeURIComponent(source) + '&destination=' + encodeURIComponent(destination))
                .then(response => response.json())
                .then(data => {
                    let html = '<h3>Available Buses</h3>';
                    if (data.length === 0) {
                        html += '<p>No buses found for this route.</p>';
                    } else {
                        data.forEach(bus => {
                            html += `<div class="bus-card">
                                <h4>${bus.busName} (${bus.busNumber})</h4>
                                <div class="bus-info">
                                    <div><strong>Type:</strong> ${bus.busType}</div>
                                    <div><strong>Available Seats:</strong> <span>${bus.availableSeats}</span></div>
                                    <div><strong>Departure:</strong> ${bus.departureTime}</div>
                                    <div><strong>Arrival:</strong> ${bus.arrivalTime}</div>
                                    <div><strong>Fare:</strong> ₹${bus.fare}</div>
                                    <div><strong>Seat Number:</strong> <input type="number" class="seat-input" min="1" max="${bus.totalSeats}" value="1"></div>
                                </div>
                                <button onclick="bookTicket(${bus.routeId}, this)">Book Now</button>
                            </div>`;
                        });
                    }
                    document.getElementById('busResults').innerHTML = html;
                })
                .catch(error => console.error('Error:', error));
        }

        function bookTicket(routeId, btn) {
            const seatInput = btn.parentElement.querySelector('.seat-input');
            const seat = seatInput.value;
            const userId = 1; // Get from session

            fetch('../api/booking', {
                method: 'POST',
                headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                body: `action=book&routeId=${routeId}&userId=${userId}&seatNumber=${seat}`
            })
            .then(response => response.json())
            .then(data => {
                if (data.status === 'success') {
                    alert(data.message);
                    searchBuses();
                } else {
                    alert('Error: ' + data.message);
                }
            })
            .catch(error => console.error('Error:', error));
        }

        function loadMyBookings() {
            const userId = 1; // Get from session

            fetch('../api/booking', {
                method: 'POST',
                headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                body: `action=myBookings&userId=${userId}`
            })
            .then(response => response.json())
            .then(data => {
                let html = '';
                if (data.bookings.length === 0) {
                    html += '<p>No bookings yet.</p>';
                } else {
                    data.bookings.forEach(booking => {
                        const statusClass = booking.status === 'CONFIRMED' ? 'status-confirmed' : 'status-cancelled';
                        html += `<div class="booking-card">
                            <h4>${booking.source} → ${booking.destination}</h4>
                            <div class="bus-info">
                                <div><strong>Booking ID:</strong> ${booking.bookingId}</div>
                                <div><strong>Seat:</strong> ${booking.seat}</div>
                                <div><strong>Departure:</strong> ${booking.departureTime}</div>
                                <div><strong>Arrival:</strong> ${booking.arrivalTime}</div>
                                <div><strong>Price:</strong> ₹${booking.price}</div>
                                <div><strong>Status:</strong> <span class="${statusClass}">${booking.status}</span></div>
                            </div>
                        </div>`;
                    });
                }
                document.getElementById('bookingsList').innerHTML = html;
            })
            .catch(error => console.error('Error:', error));
        }
    </script>
</body>
</html>
